<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>BRINGMINE.SHOP</title>
    
    <meta property="og:title" content="A shop on BRINGMINE waiting for you!">
    <meta property="og:description" content="Tap to browse products and deals from this seller. Delivery available near you.">
    <meta property="og:image" content="https://www.bringmine.shop/android-chrome-192x192.png">
    <meta property="og:url" content="https://www.bringmine.shop/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BRINGMINE.SHOP">
    <meta name="twitter:card" content="summary_large_image">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fdf2f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .card {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(236,72,153,0.15);
            text-align: center;
            padding: 32px 24px;
        }
        .shop-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ec4899, #db2777);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
        }
        .badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .shop-name {
            font-size: 22px;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 6px;
        }
        .shop-info {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 4px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0;
        }
        .stat {
            background: #f9fafb;
            padding: 12px 20px;
            border-radius: 14px;
        }
        .stat-number {
            font-size: 24px;
            font-weight: 800;
            color: #ec4899;
        }
        .stat-label {
            font-size: 10px;
            color: #6b7280;
            font-weight: 600;
        }
        .cta-button {
            display: inline-block;
            padding: 16px 48px;
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(236,72,153,0.35);
            margin-top: 8px;
        }
        .footer-link {
            margin-top: 12px;
            font-size: 11px;
            color: #9ca3af;
        }
        .footer-link a {
            color: #ec4899;
            text-decoration: none;
            font-weight: 700;
        }
        #loading { padding: 40px; color: #6b7280; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #fbcfe8;
            border-top-color: #ec4899;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div id="loading">
            <div class="spinner"></div>
            <div style="font-weight:600;">Loading shop...</div>
        </div>
    </div>
    
    <script>
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var shopId = urlParams.get('shop');
            var siteUrl = 'https://www.bringmine.shop';
            var supabaseUrl = 'https://fieijyaodnlaziqezkum.supabase.co';
            var supabaseKey = 'sb_publishable_X5p_Eu3LpQ8oCccZ6IFQww_9BQuWgBi';
            
            if (!shopId) {
                window.location.href = siteUrl;
                return;
            }
            
            var card = document.getElementById('card');
            
            // Fetch seller info
            Promise.all([
                fetch(supabaseUrl + '/rest/v1/users?select=data&phone=eq.' + encodeURIComponent(shopId), {
                    headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey }
                }).then(function(r) { return r.json(); }),
                fetch(supabaseUrl + '/rest/v1/products?select=data&id=eq.' + encodeURIComponent(shopId + '_fullimg'), {
                    headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey }
                }).then(function(r) { return r.json(); })
            ])
            .then(function(results) {
                var users = results[0];
                var shopPicture = results[1];
                
                var sellerName = 'Seller';
                var location = 'Botswana';
                var productCount = 0;
                
                if (users && users.length > 0 && users[0].data) {
                    var u = users[0].data;
                    sellerName = u.name || u.businessName || 'Seller';
                    location = u.location || u.village || u.town || 'Botswana';
                }
                
                var shopUrl = siteUrl + '?shop=' + shopId;
                var maskedName = shopId.length >= 4 ? '....' + shopId.slice(-4) : sellerName;
                
                document.title = sellerName + ' on BRINGMINE';
                
                var html = '';
                html += '<div class="shop-icon">&#127968;</div>';
                html += '<div class="badge">BRINGMINE.SHOP</div>';
                html += '<div class="shop-name">' + esc(sellerName) + '</div>';
                html += '<div class="shop-info">' + esc(maskedName) + '</div>';
                html += '<div class="shop-info">&#128205; ' + esc(location) + '</div>';
                html += '<div class="stats">';
                html += '<div class="stat"><div class="stat-number" id="prodCount">...</div><div class="stat-label">Products</div></div>';
                html += '<div class="stat"><div class="stat-number">&#128666;</div><div class="stat-label">Delivery</div></div>';
                html += '</div>';
                html += '<a href="' + shopUrl + '" class="cta-button">View Shop on BRINGMINE</a>';
                html += '<div class="footer-link">Browse more on <a href="' + siteUrl + '">bringmine.shop</a></div>';
                
                card.innerHTML = html;
                
                // Count products
                fetch(supabaseUrl + '/rest/v1/products?select=data&limit=50', {
                    headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey }
                })
                .then(function(r) { return r.json(); })
                .then(function(products) {
                    var count = 0;
                    for (var i = 0; i < products.length; i++) {
                        if (products[i].data && 
                            (products[i].data.sellerId === shopId || products[i].data.sellerPhone === shopId) &&
                            products[i].data.approved && products[i].data.stock > 0) {
                            count++;
                        }
                    }
                    document.getElementById('prodCount').textContent = count;
                })
                .catch(function() {
                    document.getElementById('prodCount').textContent = '--';
                });
            })
            .catch(function() {
                card.innerHTML = 
                    '<div class="shop-icon">&#127968;</div>' +
                    '<h3 style="color:#1f2937;margin-bottom:8px;">Shop Unavailable</h3>' +
                    '<p style="color:#6b7280;font-size:13px;margin-bottom:16px;">This shop may no longer be available.</p>' +
                    '<a href="' + siteUrl + '" class="cta-button">Browse BRINGMINE</a>';
            });
            
            function esc(str) {
                var d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }
        })();
    </script>
</body>
</html>

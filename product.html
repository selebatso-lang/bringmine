<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>BRINGMINE.SHOP</title>
    
    <meta property="og:title" content="Check out this product on BRINGMINE!">
    <meta property="og:description" content="Tap to see price and details. Delivery available near you.">
    <meta property="og:image" content="https://www.bringmine.shop/android-chrome-192x192.png">
    <meta property="og:url" content="https://www.bringmine.shop/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BRINGMINE.SHOP">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://www.bringmine.shop/android-chrome-192x192.png">
    
  
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fdf2f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(236,72,153,0.15);
        }
        
        .image-section {
            position: relative;
            background: #fafafa;
            padding: 16px;
            text-align: center;
        }
        
        .image-section img {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 12px;
            background: white;
        }
        
        .image-badge {
            position: absolute;
            top: 24px;
            left: 24px;
            background: #ec4899;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .image-stock {
            position: absolute;
            top: 24px;
            right: 24px;
            background: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .info-section {
            padding: 20px 20px 24px;
        }
        
        .brand-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .brand-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .brand-text {
            font-size: 11px;
            color: #10b981;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .product-name {
            font-size: 22px;
            font-weight: 800;
            color: #1f2937;
            line-height: 1.3;
            margin-bottom: 6px;
        }
        
        .category-tag {
            display: inline-block;
            background: #fdf2f8;
            color: #be185d;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .price-box {
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 2px solid #fde68a;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 14px;
        }
        
        .price-amount {
            font-size: 36px;
            font-weight: 900;
            color: #f59e0b;
            line-height: 1;
            letter-spacing: -1px;
        }
        
        .price-label {
            font-size: 12px;
            color: #92400e;
            margin-top: 4px;
            font-weight: 600;
        }
        
        .description-box {
            background: #f9fafb;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            border-left: 4px solid #ec4899;
        }
        
        .description-label {
            font-size: 10px;
            color: #ec4899;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        
        .description-text {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.6;
        }
        
        .features-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .feature-pill {
            background: #f0fdf4;
            color: #065f46;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .cta-button {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(236,72,153,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }
        
        .cta-button:active {
            transform: scale(0.98);
        }
        
        .trust-strip {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 10px;
            color: #6b7280;
            font-weight: 600;
        }
        
        .trust-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 3px;
            vertical-align: -2px;
        }
        
        .footer-link {
            text-align: center;
            margin-top: 10px;
            font-size: 11px;
            color: #9ca3af;
        }
        
        .footer-link a {
            color: #ec4899;
            text-decoration: none;
            font-weight: 700;
        }
        
        #loading {
            padding: 60px 20px;
            text-align: center;
            color: #6b7280;
        }
        
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #fbcfe8;
            border-top-color: #ec4899;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-state {
            padding: 40px 20px;
            text-align: center;
        }
        
        .error-icon {
            width: 64px;
            height: 64px;
            background: #fdf2f8;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .error-state h3 { color: #1f2937; margin-bottom: 6px; font-size: 18px; }
        .error-state p { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
        .error-btn {
            display: inline-block;
            padding: 14px 36px;
            background: #ec4899;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div id="loading">
            <div class="spinner"></div>
            <div style="font-weight:600;">Loading your find...</div>
        </div>
    </div>
    
    <script>
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var productId = urlParams.get('p');
            var siteUrl = 'https://www.bringmine.shop';
            var supabaseUrl = 'https://fieijyaodnlaziqezkum.supabase.co';
            var supabaseKey = 'sb_publishable_X5p_Eu3LpQ8oCccZ6IFQww_9BQuWgBi';
            
            if (!productId) {
                window.location.href = siteUrl;
                return;
            }
            
            var card = document.getElementById('card');
            
            fetch(supabaseUrl + '/rest/v1/products?select=data&id=eq.' + encodeURIComponent(productId), {
                headers: {
                    'apikey': supabaseKey,
                    'Authorization': 'Bearer ' + supabaseKey,
                    'Accept': 'application/json'
                }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data || !data.length || !data[0].data) {
                    showError();
                    return;
                }
                
                var p = data[0].data;
                var imgUrl = supabaseUrl + '/functions/v1/product-image?p=' + productId;
                var productUrl = siteUrl + '?p=' + productId;
                var desc = (p.description || '').substring(0, 300);
                if (p.description && p.description.length > 300) desc += '...';
                var category = p.mainCategory || p.categoryName || '';
                var stock = p.stock || 0;
                var stockLabel = stock > 10 ? 'In Stock' : stock > 0 ? 'Only ' + stock + ' left' : 'Sold Out';
                var stockColor = stock > 10 ? '#10b981' : stock > 0 ? '#f59e0b' : '#ef4444';
                
                document.title = p.name + ' - P' + (p.price || 0).toFixed(2) + ' | BRINGMINE';
                
                var html = '';
                
                // Image section
                html += '<div class="image-section">';
                html += '<div class="image-badge">NEW</div>';
                html += '<div class="image-stock" style="color:' + stockColor + '">' + stockLabel + '</div>';
                html += '<img src="' + imgUrl + '" alt="' + esc(p.name) + '" onerror="this.style.display=\'none\'">';
                html += '</div>';
                
                // Info section
                html += '<div class="info-section">';
                
                // Brand row
                html += '<div class="brand-row">';
                html += '<div class="brand-dot"></div>';
                html += '<div class="brand-text">BRINGMINE.SHOP</div>';
                html += '</div>';
                
                // Product name
                html += '<h1 class="product-name">' + esc(p.name) + '</h1>';
                
                // Category
                if (category) {
                    html += '<div class="category-tag">' + esc(category) + '</div>';
                }
                
                // Price
                html += '<div class="price-box">';
                html += '<div class="price-amount">P' + (p.price || 0).toFixed(2) + '</div>';
                html += '<div class="price-label">per ' + esc(p.unit || 'item') + ' &middot; Great Value</div>';
                html += '</div>';
                
                // Description
                if (desc) {
                    html += '<div class="description-box">';
                    html += '<div class="description-label">Why You\'ll Love It</div>';
                    html += '<div class="description-text">' + esc(desc) + '</div>';
                    html += '</div>';
                }
                
                // Features
                html += '<div class="features-row">';
                if (p.unit) html += '<div class="feature-pill"><span class="trust-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l4.59-4.58L18 11l-6 6z"/></svg></span> ' + esc(p.unit) + '</div>';
                html += '<div class="feature-pill"><span class="trust-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></span> Verified Seller</div>';
                html += '<div class="feature-pill"><span class="trust-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg></span> Delivery Available</div>';
                html += '<div class="feature-pill"><span class="trust-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg></span> Near You</div>';
                html += '</div>';
                
                // CTA
                html += '<a href="' + productUrl + '" class="cta-button">View on BRINGMINE \u2014 See Full Details</a>';
                
                // Trust
                html += '<div class="trust-strip">';
                html += '<span><span class="trust-icon"><svg viewBox="0 0 24 24" fill="#6b7280" width="14" height="14"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg></span> Secure</span>';
                html += '<span><span class="trust-icon"><svg viewBox="0 0 24 24" fill="#6b7280" width="14" height="14"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/></svg></span> Trusted</span>';
                html += '<span><span class="trust-icon"><svg viewBox="0 0 24 24" fill="#6b7280" width="14" height="14"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></span> Chat with Seller</span>';
                html += '</div>';
                
                // Footer
                html += '<div class="footer-link">Browse more on <a href="' + siteUrl + '">bringmine.shop</a></div>';
                
                html += '</div>';
                
                card.innerHTML = html;
            })
            .catch(function() {
                showError();
            });
            
            function showError() {
                card.innerHTML = 
                    '<div class="error-state">' +
                    '<div class="error-icon">&#128230;</div>' +
                    '<h3>This item is no longer available</h3>' +
                    '<p>But there are plenty more waiting for you!</p>' +
                    '<a href="' + siteUrl + '" class="error-btn">Discover More on BRINGMINE</a>' +
                    '</div>';
            }
            
            function esc(str) {
                var d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }
        })();
    </script>
</body>
</html>
